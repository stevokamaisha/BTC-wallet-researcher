name: Genesis clue research

on:
  push:
    branches: [genesis-research]
    paths:
      - 'research/genesis/**'
      - '.github/workflows/genesis-research.yml'
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded research dependencies
        run: python -m pip install --disable-pip-version-check bip-utils==2.10.0
      - name: Run Genesis clue pass
        run: python research/genesis/genesis_clue_pass.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-clue-pass-a
          path: genesis-pass-a-results.json
          if-no-files-found: warn
